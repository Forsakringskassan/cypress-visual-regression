name: Release
concurrency: release-${{ github.ref }}

on:
    push:
        branches:
            - master

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Release
        uses: Forsakringskassan/.github/.github/workflows/npm-release.yaml@a8d2864a5e15a8bdb1d28bfbe3c1222c4e4ca344 # main
        with:
            app-id: ${{ vars.RELEASE_APP_ID }}
        secrets:
            app-key: ${{ secrets.RELEASE_APP_KEY }}
